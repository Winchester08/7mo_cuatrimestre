{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{nombre_sistema}}</title>
    <link rel="stylesheet" href="{% static '/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static '/css/login.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="login-image"></div>

     
        <div class="login-form">
            <h3>Bienvenidos</h3>
            <h3>Tren Tickets | RW</h3>
            
                
            <form action="{% url 'validar' %}" method="POST">
               {% csrf_token %}
                <fieldset style="padding: 40px; ">
                   
                Usuario: <input type="text" name="usuario" placeholder="Nombre" id="usuario">
                Contraseña: <input type="password" name="clave" placeholder="Contraseña" id="usuario">
                <button type="submit" class="btn btn-success" id="entrar">Entrar Sistema</button>
            </fieldset>
            </form>
        {% if messages %}
        {% for mensajes in messages %}
       <span>{{mensajes}}</span>
        </div>
        {% endfor %}
        {% endif %}
    </div>
</body>
</html>
